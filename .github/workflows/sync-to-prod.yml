# Sync main branch → mrafik3012/hexcentric-prod (production)
#
# Setup:
#   1. Create empty repo: https://github.com/mrafik3012/hexcentric-prod
#   2. Classic PAT with "repo" scope on your mrafik3012 account
#   3. Add secret on hexcentric-roof: PROD_REPO_TOKEN = your PAT
#   4. Run this workflow

name: Sync to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main to hexcentric-prod via gh CLI
        env:
          GH_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::PROD_REPO_TOKEN secret is not set."
            exit 1
          fi

          echo "Checking token access..."
          gh auth status
          gh repo view mrafik3012/hexcentric-prod > /dev/null
          gh repo view mrafik3012/hexcentric-roof > /dev/null

          echo "Syncing hexcentric-roof main → hexcentric-prod main..."
          gh repo sync mrafik3012/hexcentric-prod \
            --source mrafik3012/hexcentric-roof \
            --branch main \
            --force

          echo "✓ Synced to https://github.com/mrafik3012/hexcentric-prod"
