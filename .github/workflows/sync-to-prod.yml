# Sync main branch → mrafik3012/hexcentric-prod (production)
#
# Setup:
#   1. Create empty repo: https://github.com/mrafik3012/hexcentric-prod
#   2. Classic PAT with "repo" scope
#   3. Secret on hexcentric-roof: PROD_REPO_TOKEN = your PAT
#   4. Run workflow

name: Sync to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bundle and push to hexcentric-prod
        env:
          PROD_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_TOKEN}" ]; then
            echo "::error::PROD_REPO_TOKEN secret is not set."
            exit 1
          fi

          echo "Creating git bundle from main..."
          git bundle create /tmp/site.bundle main

          echo "Preparing isolated push environment (avoids GITHUB_TOKEN conflict)..."
          mkdir -p /tmp/prod-push && cd /tmp/prod-push
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull -q /tmp/site.bundle main
          git branch -M main

          echo "Pushing to hexcentric-prod with PAT..."
          git -c credential.helper= push \
            "https://x-access-token:${PROD_TOKEN}@github.com/mrafik3012/hexcentric-prod.git" \
            main --force

          echo "✓ Synced to https://github.com/mrafik3012/hexcentric-prod"
