# Sync main branch → mrafik3012/hexcentric-prod (production)
#
# Requires classic PAT with "repo" scope → secret PROD_REPO_TOKEN
# (workflow scope NOT required — dev CI files are stripped before prod push)

name: Sync to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bundle and push to hexcentric-prod
        env:
          PROD_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
        run: |
          set -euo pipefail

          # Trim whitespace/newlines from secret (common copy-paste issue)
          PROD_TOKEN="$(printf '%s' "${PROD_TOKEN}" | tr -d '[:space:]')"

          if [ -z "${PROD_TOKEN}" ]; then
            echo "::error::PROD_REPO_TOKEN secret is not set."
            exit 1
          fi

          echo "Token length: ${#PROD_TOKEN} chars"

          # Verify PAT can push via API
          HTTP=$(curl -s -o /tmp/prod.json -w "%{http_code}" \
            -H "Authorization: Bearer ${PROD_TOKEN}" \
            https://api.github.com/repos/mrafik3012/hexcentric-prod)
          if [ "${HTTP}" != "200" ]; then
            echo "::error::PAT cannot access hexcentric-prod (HTTP ${HTTP})"
            cat /tmp/prod.json
            exit 1
          fi

          git bundle create /tmp/site.bundle main

          mkdir -p /tmp/prod-push && cd /tmp/prod-push
          git init -q
          git config user.name "Hexcentric Deploy"
          git config user.email "actions@users.noreply.github.com"
          git pull -q /tmp/site.bundle main
          git branch -M main

          # Production repo is static site only — exclude dev CI (avoids needing workflow PAT scope)
          if [ -d .github ]; then
            rm -rf .github
            git add -A
            git commit -m "Production deploy: exclude dev GitHub Actions workflows"
          fi

          # Unset Actions tokens so git cannot use github-actions[bot]
          unset GITHUB_TOKEN GH_TOKEN CI

          PROD_URL="https://x-access-token:${PROD_TOKEN}@github.com/mrafik3012/hexcentric-prod.git"

          echo "Pushing to hexcentric-prod..."
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= push "${PROD_URL}" main --force

          echo "✓ Synced to https://github.com/mrafik3012/hexcentric-prod"
